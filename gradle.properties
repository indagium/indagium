# Compose Desktop blocks Homebrew JDK packaging by default. This keeps local
# package smoke tests runnable; release builds should use a production JDK.
compose.desktop.packaging.checkJdkVendor=false
app.version=1.9.2

# SettingsDialog.kt's single SettingsDialog() composable is large enough that the Compose
# compiler's IR-to-bytecode transform runs the Kotlin daemon out of its default heap
# ("GC overhead limit exceeded" during codegen). Give the daemon more room.
kotlin.daemon.jvmargs=-Xmx4096m

# Let desktopTest decide pass/fail itself. Otherwise, whenever the aggregate allTests task is in
# the build (it is under `build`/`check`), the Kotlin plugin sets desktopTest.ignoreFailures and
# allTests fails the build if any test ever failed, including a first attempt that passed on a CI
# retry, so the test-retry setup in build.gradle.kts could never save a build. This also keeps the
# per-task report in build/reports/tests/desktopTest, which CI uploads on failure.
kotlin.tests.individualTaskReports=true
