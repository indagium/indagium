app-id: com.indagium.Indagium
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: com.indagium.Indagium
finish-args:
  # Logs and source trees are selected from arbitrary locations in the user's home directory.
  - --filesystem=home
  # Network-backed AI providers and the built-in loopback MCP control server need networking.
  - --share=network
  # The bundled JDK's AWT/Skiko toolkit is X11-only (no Wayland backend), so it always
  # needs an X11 display, via XWayland when the session is Wayland. `fallback-x11` grants
  # X11 ONLY when no Wayland compositor is present, so on any Wayland session flatpak binds
  # the Wayland socket instead, leaves /tmp/.X11-unix unbound, and unsets DISPLAY inside the
  # sandbox — a deterministic HeadlessException at startup for every Wayland user.
  # `--socket=wayland` is a permission the toolkit can never exercise; plain `--socket=x11`
  # is what actually works, with XWayland transparently serving Wayland sessions.
  # Revisit only if the bundled runtime becomes Wayland-capable (e.g. a JBR WLToolkit).
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: indagium
    buildsystem: simple
    build-commands:
      - install -d /app/indagium
      - cp -a app/. /app/indagium/
      - install -Dm755 packaging/linux/flatpak-launcher.sh /app/bin/com.indagium.Indagium
      - install -Dm644 packaging/linux/com.indagium.Indagium.desktop /app/share/applications/com.indagium.Indagium.desktop
      - install -Dm644 packaging/linux/com.indagium.Indagium.metainfo.xml /app/share/metainfo/com.indagium.Indagium.metainfo.xml
      - install -Dm644 packaging/linux/indagium-mimeinfo.xml /app/share/mime/packages/com.indagium.Indagium-mimeinfo.xml
      # AppStream resolves the desktop entry's Icon= value through the standard hicolor
      # directories. The image dimensions must match the directory, so install the
      # packaging-specific 512px derivative rather than the 1024px source artwork.
      - install -Dm644 packaging/linux/com.indagium.Indagium.png /app/share/icons/hicolor/512x512/apps/com.indagium.Indagium.png
    sources:
      - type: dir
        path: .
