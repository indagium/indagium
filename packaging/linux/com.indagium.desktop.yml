app-id: com.indagium.desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: com.indagium.desktop
finish-args:
  # Logs and source trees are selected from arbitrary locations in the user's home directory.
  - --filesystem=home
  # Network-backed AI providers and the built-in loopback MCP control server need networking.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: indagium
    buildsystem: simple
    build-commands:
      - install -d /app/indagium
      - cp -a app/. /app/indagium/
      - install -Dm755 packaging/linux/flatpak-launcher.sh /app/bin/com.indagium.desktop
      - install -Dm644 packaging/linux/com.indagium.desktop.desktop /app/share/applications/com.indagium.desktop.desktop
      - install -Dm644 packaging/linux/com.indagium.desktop.metainfo.xml /app/share/metainfo/com.indagium.desktop.metainfo.xml
      - install -Dm644 packaging/linux/indagium-mimeinfo.xml /app/share/mime/packages/com.indagium.desktop-mimeinfo.xml
      - install -Dm644 icons/indagium.png /app/share/icons/hicolor/1024x1024/apps/com.indagium.desktop.png
    sources:
      - type: dir
        path: .
