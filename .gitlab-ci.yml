# Mirrors .github/workflows/build.yml's packaging jobs on GitLab's shared runners — a separate
# compute/storage pool from GitHub Actions, so a release isn't blocked by GitHub's artifact
# storage quota. The linux-x64 .deb builds automatically on tag pipelines; Windows/.msi and
# macOS/.dmg are manual (`when: manual`) rather than automatic, since GitLab's shared macOS
# runners cost 6-12x the free-tier minute pool and Windows runners are still in beta — both are
# cheap enough to run occasionally by request, not worth burning quota on every tag.
stages:
  - verify
  - package

image: eclipse-temurin:21-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    # "Run pipeline" from the UI on any branch. Not `push`: every branch pipeline would then
    # burn shared-runner minutes on work that GitHub Actions already does per commit. This
    # exists so a one-off binary can be built for a platform GitHub Actions has no runner for
    # (see package-linux-arm64-deb), on demand rather than on every push.
    - if: '$CI_PIPELINE_SOURCE == "web"'

.gradle_cache: &gradle_cache
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle.kts
  paths:
    - .gradle/wrapper
    - .gradle/caches

verify:
  stage: verify
  cache: *gradle_cache
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  # The licence-inventory checks wired into resource generation and `check` run Python.
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3
  script:
    - chmod +x gradlew
    - ./gradlew build

media-sources:
  stage: verify
  needs:
    - job: verify
      optional: true
  cache: *gradle_cache
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl python3
  script:
    - chmod +x gradlew
    - ./gradlew prepareMediaSources
  artifacts:
    name: "Indagium-media-sources-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/Indagium-*-media-sources.tar.gz
      - build/Indagium-*-media-sources.tar.gz.sha256
      - build/Indagium-*-media-sources.tar.gz.manifest.json
    expire_in: 90 days

# Shared by the x64 and arm64 .deb jobs — identical packaging, different runner architecture.
# jpackage only ever builds for the machine it runs on, so an arm64 .deb needs an arm64 runner.
.package-linux-deb:
  stage: package
  cache: *gradle_cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq desktop-file-utils fakeroot curl python3
  script:
    - chmod +x gradlew
    - ./gradlew packageDeb
    - deb=$(find build/compose/binaries/main/deb -name '*.deb')
    - workdir=$(mktemp -d)
    - dpkg-deb -R "$deb" "$workdir"
    - desktop_file=$(find "$workdir/opt" -maxdepth 3 -type f -name '*.desktop')
    # StartupWMClass: jpackage never emits it, so docks/taskbars can't match the running
    # window (WM_CLASS "Indagium", set in Main.kt) back to this launcher entry.
    - |
      if ! grep -q '^StartupWMClass=' "$desktop_file"; then
        echo "StartupWMClass=Indagium" >> "$desktop_file"
      fi
    # Rebuild the desktop/MIME cache post-install as a safety net alongside xdg-desktop-menu.
    - |
      postinst="$workdir/DEBIAN/postinst"
      if [ -f "$postinst" ] && ! grep -q 'update-desktop-database' "$postinst"; then
        echo 'update-desktop-database -q /usr/share/applications 2>/dev/null || true' >> "$postinst"
      fi
    # Desktop Entry Spec: a MimeType entry needs a field code in Exec or "Open With" no-ops.
    - |
      if ! grep -q '^Exec=.* %F$' "$desktop_file"; then
        sed -i 's|^\(Exec=.*\)$|\1 %F|' "$desktop_file"
      fi
    # jpackage repeats MimeType=text/plain once per fileAssociation() call - dedupe.
    - |
      mime_line=$(grep '^MimeType=' "$desktop_file" || true)
      if [ -n "$mime_line" ]; then
        deduped=$(echo "${mime_line#MimeType=}" | tr ';' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ';')
        sed -i "s|^MimeType=.*|MimeType=${deduped}|" "$desktop_file"
      fi
    # desktop-file-validate rejects a Categories list with no trailing separator.
    - |
      if grep -q '^Categories=[^;]*$' "$desktop_file"; then
        sed -i 's|^\(Categories=.*\)$|\1;|' "$desktop_file"
      fi
    - |
      mimeinfo_file=$(find "$workdir/opt" -name '*-MimeInfo.xml')
      if [ -n "$mimeinfo_file" ]; then
        cp packaging/linux/indagium-mimeinfo.xml "$mimeinfo_file"
      fi
    - dpkg-deb -b "$workdir" "$deb"
    - finaldir=$(mktemp -d)
    - dpkg-deb -R "$deb" "$finaldir"
    - final_desktop_file=$(find "$finaldir/opt" -maxdepth 3 -type f -name '*.desktop')
    - desktop-file-validate "$final_desktop_file"
    - app_version=$(sed -n 's/^app.version=//p' gradle.properties)
    - python3 scripts/prepare_media_sources.py --app-version "$app_version" --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --platform "$MEDIA_PLATFORM" --package-root "$finaldir"
    - grep -q '^Exec=.* %F$' "$final_desktop_file"
    - rm -rf "$workdir"
    - rm -rf "$finaldir"
  artifacts:
    paths:
      - build/compose/binaries/main/deb/*.deb
      - build/Indagium-*-media-sources.tar.gz
      - build/Indagium-*-media-sources.tar.gz.sha256
      - build/Indagium-*-media-sources.tar.gz.manifest.json
    expire_in: 90 days

package-linux-deb:
  extends: .package-linux-deb
  needs: ["verify", "media-sources"]
  variables:
    MEDIA_PLATFORM: linux-x64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  artifacts:
    name: "Indagium-linux-x64-$CI_COMMIT_TAG"

# GitHub Actions has no Linux arm64 runner, so this is the only way to get an arm64 build.
# Runs automatically in a "Run pipeline" (web) pipeline on any branch and is manual on tags:
# a plain binary for testing, deliberately not wired into the release flow. No `needs: verify`
# — verify is tag-only, and packageDeb compiles everything it needs anyway.
package-linux-arm64-deb:
  extends: .package-linux-deb
  needs: ["media-sources"]
  variables:
    MEDIA_PLATFORM: linux-arm64
  # small, not medium: the arm64 medium/large runners are Premium/Ultimate-only, so a medium tag
  # fails instantly with "no runners with these tags". small-arm64 is on every tier and matches
  # the small-amd64 spec (2 vCPU / 8 GB) the x64 .deb job above already builds on.
  tags:
    - saas-linux-small-arm64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
  artifacts:
    name: "Indagium-linux-arm64-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

# Optional, triggered manually from the pipeline view (the "play" button on this job) — not
# part of the automatic tag pipeline.
package-windows-msi:
  stage: package
  needs: ["verify", "media-sources"]
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
  before_script:
    - choco install temurin21 python3 -y --no-progress
    - refreshenv
  script:
    - .\gradlew.bat packageMsi
    - $msi = (Get-ChildItem 'build/compose/binaries/main/msi' -Filter '*.msi' -File | Select-Object -First 1).FullName
    - if (-not $msi) { throw 'The Windows MSI was not produced.' }
    - $expanded = Join-Path $env:TEMP 'indagium-msi-expanded'
    - New-Item -ItemType Directory -Force -Path $expanded | Out-Null
    - $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$expanded`"") -Wait -PassThru
    - if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed with exit code $($process.ExitCode)." }
    - $appVersion = (Select-String -Path 'gradle.properties' -Pattern '^app\.version=(.+)$').Matches[0].Groups[1].Value
    - python scripts/prepare_media_sources.py --app-version $appVersion --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --platform windows-x64 --package-root $expanded
  artifacts:
    name: "Indagium-windows-x64-$CI_COMMIT_TAG"
    paths:
      - build/compose/binaries/main/msi/*.msi
      - build/Indagium-*-media-sources.tar.gz
      - build/Indagium-*-media-sources.tar.gz.sha256
      - build/Indagium-*-media-sources.tar.gz.manifest.json
    expire_in: 90 days

# Optional, triggered manually — see package-windows-msi above. Runs on GitLab's Apple
# Silicon (M1) SaaS runners, matching the arm64 macOS build GitHub Actions produces.
package-macos-dmg:
  stage: package
  needs: ["verify", "media-sources"]
  tags:
    - saas-macos-medium-m1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: true
  before_script:
    - brew install --quiet openjdk@21 python@3.12
    - export JAVA_HOME="/opt/homebrew/opt/openjdk@21"
    - export PATH="/opt/homebrew/opt/openjdk@21/bin:$PATH"
  script:
    - chmod +x gradlew
    - ./gradlew packageDmg
    - |
      set -euo pipefail
      dmg=$(find build/compose/binaries/main/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
      test -n "$dmg"
      gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
      ffmpeg_jar=$(find "$gradle_user_home/caches/modules-2/files-2.1/org.bytedeco/ffmpeg/8.0.1-1.5.13" -type f -name 'ffmpeg-8.0.1-1.5.13-macosx-arm64.jar' -print -quit)
      zstd_jar=$(find "$gradle_user_home/caches/modules-2/files-2.1/com.github.luben/zstd-jni/1.5.7-4" -type f -name 'zstd-jni-1.5.7-4-darwin_aarch64.jar' -print -quit)
      test -n "$ffmpeg_jar" && test -n "$zstd_jar"
      mountpoint=$(mktemp -d)
      cleanup() {
        hdiutil detach "$mountpoint" -quiet || true
        rm -rf "$mountpoint"
      }
      trap cleanup EXIT
      hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" -quiet
      app=$(find "$mountpoint" -maxdepth 2 -type d -name 'Indagium.app' -print -quit)
      test -n "$app"
      app_version=$(sed -n 's/^app.version=//p' gradle.properties)
      python3 scripts/prepare_media_sources.py --app-version "$app_version" --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --platform macos-arm64 --package-root "$app/Contents/app" --ffmpeg-jar "$ffmpeg_jar" --zstd-jar "$zstd_jar"
  artifacts:
    name: "Indagium-macos-arm64-$CI_COMMIT_TAG"
    paths:
      - build/compose/binaries/main/dmg/*.dmg
      - build/Indagium-*-media-sources.tar.gz
      - build/Indagium-*-media-sources.tar.gz.sha256
      - build/Indagium-*-media-sources.tar.gz.manifest.json
    expire_in: 90 days
