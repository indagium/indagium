name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - site/**
      - EULA.md
      - scripts/distribution_legal.py
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare website artifact
        run: |
          python3 scripts/distribution_legal.py --check-site
          mkdir -p _site
          rsync -a --exclude='*.mov' site/ _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
