name: Build Distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_scope:
        description: 'Packages to build after verification'
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-portable

# `linux-portable` lets us prove the two Linux portable formats on both supported architectures
# without reserving Windows or macOS runners.  Tag-triggered builds (and the default manual
# dispatch) keep the complete release matrix below.
jobs:
  select-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - id: select
        name: Select packaging matrix
        env:
          BUILD_SCOPE: ${{ github.event.inputs.build_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$BUILD_SCOPE" in
            linux-portable)
              matrix='{"include":[
                {"os":"ubuntu-latest","tasks":"packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-portable-x64","linux":true,"include_deb":false,"portable_arch":"x86_64"},
                {"os":"ubuntu-24.04-arm","tasks":"packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-portable-arm64","linux":true,"include_deb":false,"portable_arch":"aarch64"}
              ]}'
              ;;
            all)
              matrix='{"include":[
                {"os":"ubuntu-latest","tasks":"packageDeb packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/deb/*.deb\nbuild/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-x64","linux":true,"include_deb":true,"deb_arch":"amd64","portable_arch":"x86_64"},
                {"os":"windows-latest","tasks":"packageMsi","artifact_path":"build/compose/binaries/main/msi","artifact_name":"Indagium-windows-x64","linux":false,"include_deb":false},
                {"os":"macos-latest","tasks":"packageDmg","artifact_path":"build/compose/binaries/main/dmg","artifact_name":"Indagium-macos-arm64","linux":false,"include_deb":false},
                {"os":"ubuntu-24.04-arm","tasks":"packageDeb packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/deb/*.deb\nbuild/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-arm64","linux":true,"include_deb":true,"deb_arch":"arm64","portable_arch":"aarch64"}
              ]}'
              ;;
            *)
              echo "Unsupported build scope: $BUILD_SCOPE" >&2
              exit 1
              ;;
          esac
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Gates the packaging matrix below: compiles, runs the full desktopTest suite, and enforces
  # ktlint/detekt (see build.gradle.kts's `check` lifecycle). Runs once on macOS — this is
  # already the OS this repo's tests are developed and verified against locally — rather than
  # per-packaging-OS, since its job is to catch code/test regressions before spending time
  # packaging on all three platforms, not to re-verify packaging itself.
  verify:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Gradle cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # This runs without Flatpak and deliberately permits only the portable
      # smoke test's supported `flatpak info --show-location` invocation. It
      # prevents a CLI-option regression from reaching the packaging matrix.
      - name: Validate portable smoke-test compatibility
        run: bash scripts/test-validate-flatpak-install.sh

      - name: Build, test, and lint
        run: ./gradlew build

      # testLogging (build.gradle.kts) already prints the full assertion message and stack trace
      # to the console log above on failure, but the HTML/XML report additionally shows per-test
      # timing and the full suite's pass/fail breakdown at a glance — useful for a CI-only flake
      # (e.g. slow-runner timing; see the note on AppStateBehaviorTest's waitUntil helper) where
      # knowing whether nearby tests also ran slow matters. Only uploaded on failure: a green run
      # has nothing worth keeping here.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-test-report
          path: |
            build/reports/tests/desktopTest
            build/test-results/desktopTest
          retention-days: 7

      # Resolved dependency report in place of a full SBOM (small dependency footprint here
      # doesn't justify a new SBOM-generating plugin) — auditable snapshot of exactly what
      # versions this release actually resolved, alongside Dependabot's advisory scanning
      # (.github/dependabot.yml) for the vulnerability-alerting half.
      - name: Generate dependency report
        run: ./gradlew dependencies --configuration desktopRuntimeClasspath > dependency-report.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 7

  build:
    needs:
      - select-build-matrix
      - verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-build-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    # windows-latest defaults `run:` steps to PowerShell, where `chmod`/`./gradlew` don't work.
    # GitHub-hosted Windows runners ship Git Bash, so force bash uniformly across all three OSes.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Restore-only: this workflow triggers on tag pushes, and GitHub scopes a *saved* cache to
      # its creating ref — tags aren't branches, so a cache saved under refs/tags/v1.1.x can only
      # ever be restored by that exact tag again, which never happens (each tag runs once). Every
      # prior release was therefore writing a full, permanent, never-reused ~1GB-per-OS cache that
      # just accumulated (18 of them ate ~9.4GB of the account's 500MB Actions storage quota).
      # actions/cache/restore@v4 only reads — falling back to whatever's cached under the default
      # branch (master) if present, or a clean cache-miss otherwise — so tag builds stop writing
      # new dead caches. Restore-keys prefix is unversioned so any master-branch Gradle cache still
      # gives a useful partial hit even when the exact dependency hash has since moved on.
      #
      # runner.arch is folded into the key too: this matrix now runs two Linux jobs (amd64 and
      # arm64) that would otherwise both report runner.os == 'Linux' and share one cache — the
      # arm64 job restoring x86_64 native jars (bytedeco/FFmpeg) from the amd64 job and failing to
      # link against them.
      - name: Restore Gradle cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # AppImage is self-contained, but Flatpak needs its builder, CLI, and the exact runtime/Sdk
      # declared in packaging/linux/com.indagium.desktop.yml.  Install these before the
      # Gradle packaging tasks so `packageFlatpak` behaves the same in CI and on a clean machine.
      - name: Install Linux portable-packaging tools
        if: matrix.linux
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils flatpak flatpak-builder libxml2-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          # The installed runner CLI must support the deployment-location API
          # used by the later installed-file smoke test.
          flatpak info --help | grep -F -- '--show-location'

      # The controller uses the host's bundled-by-JavaCV FFmpeg native, so the duration-recovery
      # path must run on every release target rather than only in the macOS-wide verification job.
      # This focused native suite covers headerless containers and raw streams without repeating
      # the whole desktop test suite four times before packaging.
      - name: Verify native video duration recovery
        run: ./gradlew desktopTest --tests 'com.indagium.VideoDurationScanTest'

      # See the matching step in the verify job: testLogging already puts the full failure in the
      # console log above, this is the report tree backup. Name suffixed with artifact_name since
      # this step runs once per matrix leg and upload-artifact rejects duplicate names in one run.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-duration-test-report-${{ matrix.artifact_name }}
          path: |
            build/reports/tests/desktopTest
            build/test-results/desktopTest
          retention-days: 7

      - name: Package distribution
        # Maven Central occasionally times out on a fresh macOS ARM runner while resolving the
        # platform-specific Compose runtime. Retry the whole package task twice; Gradle reuses any
        # artifacts downloaded before a failed attempt, so this is both bounded and inexpensive
        # when the repository has a transient network failure.
        run: |
          for attempt in 1 2 3; do
            if ./gradlew ${{ matrix.tasks }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Packaging attempt $attempt failed; retrying in 30 seconds..."
              sleep 30
            fi
          done
          exit 1

      # jpackage doesn't emit StartupWMClass in the .desktop file it generates (no Gradle DSL
      # hook for it either), so docks/taskbars can't match the running window (WM_CLASS set to
      # "Indagium" via sun.java.command in Main.kt) back to this launcher entry — falls back to
      # a generic icon and the raw class name. Patch it in post-build since the .deb is just an
      # archive. The .desktop file ships at opt/<packageName>/lib/, not usr/share/applications —
      # postinst runs `xdg-desktop-menu install` on it at install time to put it there.
      #
      # Also defensively ensure postinst rebuilds the desktop/MIME cache after that install: the
      # fileAssociation() entries in build.gradle.kts land as MimeType= in the generated .desktop
      # file, but file managers resolve "Open With" candidates from the cached
      # /usr/share/applications/mimeinfo.cache, which is only rebuilt by update-desktop-database.
      # xdg-desktop-menu install may already trigger this internally on most distros, but jpackage
      # gives no guarantee of it (same class of gap as StartupWMClass above), so append an
      # idempotent call as a safety net rather than relying on unverified distro behavior.
      #
      # Three further defects in the same generated artifacts, per the Desktop Entry Spec
      # (https://specifications.freedesktop.org/desktop-entry/latest/exec-variables.html): an
      # entry that declares MimeType must carry a field code in Exec or it can never receive a
      # file at all — jpackage emits Exec with none, so "Open With Indagium" silently no-ops.
      # Append %F (not %f: Main.kt/AppState.openPaths takes a List<File>, and the single-instance
      # handoff wants to forward every path from one launch in one shot). Second, jpackage repeats
      # MimeType=text/plain once per fileAssociation() call — dedupe preserving first-seen order.
      # Third, replace the generated MimeInfo XML (duplicate text/plain blocks, each overriding
      # the system's own <comment>) with the hand-authored packaging/linux/indagium-mimeinfo.xml,
      # which only declares globs for extensions the system doesn't already type.
      - name: Add StartupWMClass and desktop-database refresh to Linux .desktop/postinst
        if: matrix.linux && matrix.include_deb
        run: |
          set -euo pipefail
          deb=$(find build/compose/binaries/main/deb -name '*.deb')
          workdir=$(mktemp -d)
          dpkg-deb -R "$deb" "$workdir"
          desktop_file=$(find "$workdir/opt" -maxdepth 3 -type f -name '*.desktop')
          if ! grep -q '^StartupWMClass=' "$desktop_file"; then
            echo "StartupWMClass=Indagium" >> "$desktop_file"
          fi
          postinst="$workdir/DEBIAN/postinst"
          if [ -f "$postinst" ] && ! grep -q 'update-desktop-database' "$postinst"; then
            echo 'update-desktop-database -q /usr/share/applications 2>/dev/null || true' >> "$postinst"
          fi
          if ! grep -q '^Exec=.* %F$' "$desktop_file"; then
            sed -i 's|^\(Exec=.*\)$|\1 %F|' "$desktop_file"
          fi
          mime_line=$(grep '^MimeType=' "$desktop_file" || true)
          if [ -n "$mime_line" ]; then
            deduped=$(echo "${mime_line#MimeType=}" | tr ';' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ';')
            sed -i "s|^MimeType=.*|MimeType=${deduped}|" "$desktop_file"
          fi
          # jpackage renders Categories= from menuGroup with no trailing separator, but the spec
          # types it as a list, and desktop-file-validate rejects a list key without one — that
          # would fail the gate below on an otherwise correct entry.
          if grep -q '^Categories=[^;]*$' "$desktop_file"; then
            sed -i 's|^\(Categories=.*\)$|\1;|' "$desktop_file"
          fi
          mimeinfo_file=$(find "$workdir/opt" -name '*-MimeInfo.xml')
          if [ -n "$mimeinfo_file" ]; then
            cp packaging/linux/indagium-mimeinfo.xml "$mimeinfo_file"
          fi
          dpkg-deb -b "$workdir" "$deb"
          rm -rf "$workdir"

      # desktop-file-validate is exactly the tool that flags "declares MimeType but Exec takes no
      # arguments" — this gate would have caught the original %F-less Exec regressing silently.
      - name: Validate generated .desktop entry
        if: matrix.linux && matrix.include_deb
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          deb=$(find build/compose/binaries/main/deb -name '*.deb')
          workdir=$(mktemp -d)
          dpkg-deb -R "$deb" "$workdir"
          desktop_file=$(find "$workdir/opt" -maxdepth 3 -type f -name '*.desktop')
          desktop-file-validate "$desktop_file"
          grep -q '^Exec=.* %F$' "$desktop_file"
          rm -rf "$workdir"

      # Verify every Linux artifact has the architecture suffix required by its packaging format
      # and that each portable package carries usable desktop/MIME metadata.  AppImage extraction
      # is deliberately done without FUSE, matching the environment used by its packaging task.
      - name: Validate and smoke-test Linux portable distributions
        if: matrix.linux
        run: |
          set -euo pipefail
          appimage=$(find build/compose/binaries/main/appimage -maxdepth 1 -type f -name "*-${{ matrix.portable_arch }}.AppImage" -print -quit)
          flatpak_bundle=$(find build/compose/binaries/main/flatpak -maxdepth 1 -type f -name "*-${{ matrix.portable_arch }}.flatpak" -print -quit)
          test -n "$appimage"
          test -n "$flatpak_bundle"
          # The extractor runs from its own temporary directory, so keep the AppImage path valid
          # after that directory change instead of relying on the checkout working directory.
          appimage=$(realpath "$appimage")
          test "$(find build/compose/binaries/main/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')" = 1
          test "$(find build/compose/binaries/main/flatpak -maxdepth 1 -type f -name '*.flatpak' | wc -l | tr -d ' ')" = 1

          if [ '${{ matrix.include_deb }}' = 'true' ]; then
            deb=$(find build/compose/binaries/main/deb -maxdepth 1 -type f -name "*_${{ matrix.deb_arch }}.deb" -print -quit)
            test -n "$deb"
            test "$(find build/compose/binaries/main/deb -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = 1
          fi

          appimage_workdir=$(mktemp -d)
          (
            cd "$appimage_workdir"
            chmod +x "$appimage"
            "$appimage" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            desktop_file=$(find squashfs-root -type f -name '*.desktop' -print -quit)
            mimeinfo_file=squashfs-root/usr/share/mime/packages/com.indagium.desktop-mimeinfo.xml
            test -n "$desktop_file"
            test -f "$mimeinfo_file"
            desktop-file-validate "$desktop_file"
            grep -q '^MimeType=.*text/plain' "$desktop_file"
            grep -q '^MimeType=.*text/x-log' "$desktop_file"
            xmllint --noout "$mimeinfo_file"
          )
          rm -rf "$appimage_workdir"

          flatpak install --user -y --bundle "$flatpak_bundle"
          flatpak info --user com.indagium.desktop
          flatpak info --user --show-metadata com.indagium.desktop | grep -q '^name=com.indagium.desktop$'
          flatpak info --user --show-permissions com.indagium.desktop | grep -q 'home'
          flatpak info --user --show-permissions com.indagium.desktop | grep -q 'network'
          bash scripts/validate-flatpak-install.sh
          flatpak uninstall --user -y com.indagium.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          # Default retention is 90 days; these only need to survive long enough for the release
          # job below to download and republish them as GitHub Release assets (minutes, not
          # months) — the prior default was the other half of what exhausted the account's 500MB
          # Actions storage quota, alongside the per-tag Gradle caches fixed above.
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # `body` is prepended to what generate_release_notes produces, so the download guidance sits
      # above the auto-generated commit list rather than replacing it. There are now three Linux
      # formats for each of two architectures, so call out both the package type and the arch
      # suffix rather than expecting people to infer compatibility from the filenames. The in-app
      # updater selects the matching release asset for .deb/AppImage launches; Flatpak updates are
      # intentionally delegated to Flatpak itself.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ### Which file do I need?

            | Your system | Download |
            |---|---|
            | Linux — Intel/AMD 64-bit | `.deb` `indagium_*_amd64.deb` · AppImage `Indagium-*-x86_64.AppImage` · Flatpak `Indagium-*-x86_64.flatpak` |
            | Linux — ARM 64-bit | `.deb` `indagium_*_arm64.deb` · AppImage `Indagium-*-aarch64.AppImage` · Flatpak `Indagium-*-aarch64.flatpak` |
            | Windows | `Indagium-*.msi` |
            | macOS — Apple Silicon | `Indagium-*.dmg` |

            Install a Linux `.deb` with `sudo dpkg -i <file>`, make an AppImage executable with
            `chmod +x <file>`, or use `flatpak install --user <file>` for a Flatpak bundle. The
            macOS build is unsigned, so Gatekeeper warns on first launch — see the README's
            Installation section for the workaround.

            Updating from **1.6.1 or earlier on Linux ARM64?** Download the `arm64` package by hand
            this once: that version's updater matched only on the `.deb` extension and will offer
            you the amd64 build. From 1.7.0 onward it selects by architecture automatically.
