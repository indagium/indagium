name: Build Distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_scope:
        description: 'Packages to build after verification'
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-portable
          - windows-only

# `linux-portable` lets us prove the two Linux portable formats on both supported architectures
# without reserving Windows or macOS runners. `windows-only` runs the Windows MSI row after the
# same verification gate. Tag-triggered builds (and the default manual dispatch) keep the complete
# release matrix below.
jobs:
  select-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - id: select
        name: Select packaging matrix
        env:
          BUILD_SCOPE: ${{ github.event.inputs.build_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$BUILD_SCOPE" in
            linux-portable)
              matrix='{"include":[
                {"os":"ubuntu-latest","tasks":"packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-portable-x64","linux":true,"include_deb":false,"portable_arch":"x86_64","media_platform":"linux-x64"},
                {"os":"ubuntu-24.04-arm","tasks":"packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-portable-arm64","linux":true,"include_deb":false,"portable_arch":"aarch64","media_platform":"linux-arm64"}
              ]}'
              ;;
            windows-only)
              matrix='{"include":[
                {"os":"windows-latest","tasks":"packageMsi","artifact_path":"build/compose/binaries/main/msi","artifact_name":"Indagium-windows-x64","linux":false,"include_deb":false,"media_platform":"windows-x64"}
              ]}'
              ;;
            all)
              matrix='{"include":[
                {"os":"ubuntu-latest","tasks":"packageDeb packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/deb/*.deb\nbuild/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-x64","linux":true,"include_deb":true,"deb_arch":"amd64","portable_arch":"x86_64","media_platform":"linux-x64"},
                {"os":"windows-latest","tasks":"packageMsi","artifact_path":"build/compose/binaries/main/msi","artifact_name":"Indagium-windows-x64","linux":false,"include_deb":false,"media_platform":"windows-x64"},
                {"os":"macos-latest","tasks":"packageDmg","artifact_path":"build/compose/binaries/main/dmg","artifact_name":"Indagium-macos-arm64","linux":false,"include_deb":false,"media_platform":"macos-arm64"},
                {"os":"ubuntu-24.04-arm","tasks":"packageDeb packageAppImage packageFlatpak","artifact_path":"build/compose/binaries/main/deb/*.deb\nbuild/compose/binaries/main/appimage/*.AppImage\nbuild/compose/binaries/main/flatpak/*.flatpak","artifact_name":"Indagium-linux-arm64","linux":true,"include_deb":true,"deb_arch":"arm64","portable_arch":"aarch64","media_platform":"linux-arm64"}
              ]}'
              ;;
            *)
              echo "Unsupported build scope: $BUILD_SCOPE" >&2
              exit 1
              ;;
          esac
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  # Gates the packaging matrix below: compiles, runs the full desktopTest suite, and enforces
  # ktlint/detekt (see build.gradle.kts's `check` lifecycle). Runs once on macOS — this is
  # already the OS this repo's tests are developed and verified against locally — rather than
  # per-packaging-OS, since its job is to catch code/test regressions before spending time
  # packaging on all three platforms, not to re-verify packaging itself.
  verify:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21.0.9+10.0.LTS'
          distribution: 'temurin'

      - name: Restore Gradle cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # This runs without Flatpak and deliberately permits only the portable
      # smoke test's supported `flatpak info --show-location` invocation. It
      # prevents a CLI-option regression from reaching the packaging matrix.
      - name: Validate portable smoke-test compatibility
        run: bash scripts/test-validate-flatpak-install.sh

      - name: Verify the source-build agreement before switching to EULA
        run: ./gradlew -Pindagium.license=polyform desktopTest --tests 'com.indagium.LicenseAgreement*'

      - name: Build, test, and lint
        run: ./gradlew -Pindagium.license=eula build

      # testLogging (build.gradle.kts) already prints the full assertion message and stack trace
      # to the console log above on failure, but the HTML/XML report additionally shows per-test
      # timing and the full suite's pass/fail breakdown at a glance — useful for a CI-only flake
      # (e.g. slow-runner timing; see the note on AppStateBehaviorTest's waitUntil helper) where
      # knowing whether nearby tests also ran slow matters. Only uploaded on failure: a green run
      # has nothing worth keeping here.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-test-report
          path: |
            build/reports/tests/desktopTest
            build/test-results/desktopTest
          retention-days: 7

      # The archive contains pinned sources, compiler/recipe inputs, legal texts, and the hashes
      # for the four inspected native targets. Packaging jobs validate their final app images on
      # each target; this separate archive is retained for verification and release attachment.
      - name: Prepare native media source archive
        run: |
          ./gradlew -Pindagium.license=eula prepareMediaSources prepareApplicationSources
          mkdir -p build/legal-release
          cp EULA.md NOTICE THIRD_PARTY_NOTICES.md build/legal-release/

      - name: Upload native media source archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Indagium-third-party-sources
          path: |
            build/Indagium-*-media-sources.tar.gz
            build/Indagium-*-media-sources.tar.gz.sha256
            build/Indagium-*-media-sources.tar.gz.manifest.json
            build/Indagium-*-application-sources.tar.gz
            build/Indagium-*-application-sources.tar.gz.sha256
            build/Indagium-*-application-sources.tar.gz.manifest.json
            build/legal-release/
          retention-days: 7

      # Resolved dependency report in place of a full SBOM (small dependency footprint here
      # doesn't justify a new SBOM-generating plugin) — auditable snapshot of exactly what
      # versions this release actually resolved, alongside Dependabot's advisory scanning
      # (.github/dependabot.yml) for the vulnerability-alerting half.
      - name: Generate dependency report
        run: ./gradlew -Pindagium.license=eula dependencies --configuration desktopRuntimeClasspath > dependency-report.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 7

  build:
    needs:
      - select-build-matrix
      - verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-build-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    # windows-latest defaults `run:` steps to PowerShell, where `chmod`/`./gradlew` don't work.
    # GitHub-hosted Windows runners ship Git Bash, so force bash uniformly across all three OSes.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Download matching third-party sources and legal documents
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Indagium-third-party-sources
          path: build

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21.0.9+10.0.LTS'
          distribution: 'temurin'

      # Restore-only: this workflow triggers on tag pushes, and GitHub scopes a *saved* cache to
      # its creating ref — tags aren't branches, so a cache saved under refs/tags/v1.1.x can only
      # ever be restored by that exact tag again, which never happens (each tag runs once). Every
      # prior release was therefore writing a full, permanent, never-reused ~1GB-per-OS cache that
      # just accumulated (18 of them ate ~9.4GB of the account's 500MB Actions storage quota).
      # actions/cache/restore@v4 only reads — falling back to whatever's cached under the default
      # branch (master) if present, or a clean cache-miss otherwise — so tag builds stop writing
      # new dead caches. Restore-keys prefix is unversioned so any master-branch Gradle cache still
      # gives a useful partial hit even when the exact dependency hash has since moved on.
      #
      # runner.arch is folded into the key too: this matrix now runs two Linux jobs (amd64 and
      # arm64) that would otherwise both report runner.os == 'Linux' and share one cache — the
      # arm64 job restoring x86_64 native jars (bytedeco/FFmpeg) from the amd64 job and failing to
      # link against them.
      - name: Restore Gradle cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # AppImage is self-contained, but Flatpak needs its builder, CLI, and the exact runtime/Sdk
      # declared in packaging/linux/com.indagium.Indagium.yml.  Install these before the
      # Gradle packaging tasks so `packageFlatpak` behaves the same in CI and on a clean machine.
      - name: Install Linux portable-packaging tools
        if: matrix.linux
        run: |
          set -euo pipefail
          # An unused third-party Chrome source can block required package setup with a hash mismatch.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils flatpak flatpak-builder libxml2-utils \
            libdrm-dev libegl1-mesa-dev libgles2-mesa-dev libva-dev libx11-dev
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          # The installed runner CLI must support the deployment-location API
          # used by the later installed-file smoke test.
          flatpak info --help | grep -F -- '--show-location'

      - name: Compile Linux VAAPI/EGL mirror bridge
        if: matrix.linux
        run: ./gradlew -Pindagium.license=eula compileLinuxMirrorNative

      - name: Compile Windows D3D11 mirror bridge
        if: startsWith(matrix.os, 'windows')
        run: ./gradlew -Pindagium.license=eula compileWindowsMirrorNative

      # The controller uses the host's bundled-by-JavaCV FFmpeg native, so the duration-recovery
      # path must run on every release target rather than only in the macOS-wide verification job.
      # This focused native suite covers headerless containers and raw streams without repeating
      # the whole desktop test suite four times before packaging.
      - name: Verify native video duration recovery
        run: ./gradlew -Pindagium.license=eula desktopTest --tests 'com.indagium.VideoDurationScanTest'

      - name: Verify microphone and Opus pipeline tests
        run: >-
          ./gradlew -Pindagium.license=eula desktopTest
          --tests 'com.indagium.capture.DesktopMicrophoneTest'
          --tests 'com.indagium.capture.TimelinePcmMixerTest'
          --tests 'com.indagium.capture.OpusPcmEncoderTest'

      # Compact archives rely on per-OS natives and file semantics: zstd-jni's unpacked library (and the
      # app-owned folder it now loads from), zip writing, the cross-process extraction lease/cache (file
      # locks and deletes behave differently on Windows) and the bundled SVT-AV1 encoder. The transcoder
      # test skips itself when a platform's bytedeco FFmpeg build lacks the encoder.
      - name: Verify Compact archive natives and file semantics
        run: >-
          ./gradlew -Pindagium.license=eula desktopTest
          --tests 'com.indagium.CaptureZstdTest'
          --tests 'com.indagium.capture.CaptureArchiveZipWriterTest'
          --tests 'com.indagium.capture.CaptureExtractionLeaseTest'
          --tests 'com.indagium.CaptureExtractionCacheTest'
          --tests 'com.indagium.capture.FfmpegAv1CompactVideoTranscoderTest'
          --tests 'com.indagium.ui.ZstdNativeFolderTest'

      - name: Smoke-test native mirror library load and Canvas handle
        if: matrix.linux || startsWith(matrix.os, 'windows')
        run: ./gradlew -Pindagium.license=eula desktopTest --tests 'com.indagium.capture.mirror.NativeMirrorBridgeSmokeTest'

      # See the matching step in the verify job: testLogging already puts the full failure in the
      # console log above, this is the report tree backup. Name suffixed with artifact_name since
      # this step runs once per matrix leg and upload-artifact rejects duplicate names in one run.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: video-duration-test-report-${{ matrix.artifact_name }}
          path: |
            build/reports/tests/desktopTest
            build/test-results/desktopTest
          retention-days: 7

      - name: Package distribution
        # Maven Central occasionally times out on a fresh macOS ARM runner while resolving the
        # platform-specific Compose runtime. Retry the whole package task twice; Gradle reuses any
        # artifacts downloaded before a failed attempt, so this is both bounded and inexpensive
        # when the repository has a transient network failure.
        env:
          # package-appimage.sh downloads appimagetool through the GitHub API, which rate-limits
          # unauthenticated calls from shared runner IPs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if ./gradlew -Pindagium.license=eula ${{ matrix.tasks }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Packaging attempt $attempt failed; retrying in 30 seconds..."
              sleep 30
            fi
          done
          exit 1

      # This runs on every distribution host/architecture so the packaged host JNI library is
      # compiled, loaded and exercised on macOS Metal, Windows CPU and both Linux CPU targets.
      # The focused test verifies the pinned model checksum itself; ordinary tests never download it.
      - name: Verify native Whisper transcription
        env:
          INDAGIUM_VOICE_MODEL: build/ci-whisper/ggml-base.bin
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$INDAGIUM_VOICE_MODEL")"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin" \
            --output "$INDAGIUM_VOICE_MODEL"
          ./gradlew -Pindagium.license=eula --no-daemon desktopTest --tests 'com.indagium.voice.WhisperNativeSmokeTest.baseModelLoadsFromUnicodePathAndTranscribesAutomaticLanguageFixtureWhenConfigured'

      - name: Validate packaged Windows D3D11 mirror bridge
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $msi = (Get-ChildItem 'build/compose/binaries/main/msi' -Filter '*.msi' -File | Select-Object -First 1).FullName
          if (-not $msi) { throw 'The Windows MSI was not produced.' }
          $expanded = Join-Path $env:RUNNER_TEMP 'indagium-msi-expanded'
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          $arguments = @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$expanded`"")
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed with exit code $($process.ExitCode)." }
          $jarTool = (Get-Command jar.exe -ErrorAction Stop).Source
          $resource = 'native/windows/indagium_mirror.dll'
          $found = $false
          foreach ($archive in Get-ChildItem -Path $expanded -Recurse -Filter '*.jar' -File) {
            $entries = & $jarTool tf $archive.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect packaged archive $($archive.FullName)." }
            if ($entries -contains $resource) {
              Write-Host "Verified $resource in $($archive.FullName)"
              $found = $true
              break
            }
          }
          if (-not $found) { throw "The packaged MSI is missing $resource." }
          $appVersion = (Select-String -Path 'gradle.properties' -Pattern '^app\.version=(.+)$').Matches[0].Groups[1].Value
          python scripts/prepare_media_sources.py --app-version $appVersion --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --license-kind eula --platform ${{ matrix.media_platform }} --package-root $expanded

      - name: Validate final macOS DMG media binaries and legal resources
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          dmg=$(find build/compose/binaries/main/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          ffmpeg_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.bytedeco/ffmpeg/8.0.1-1.5.13" -type f -name 'ffmpeg-8.0.1-1.5.13-macosx-arm64.jar' -print -quit)
          zstd_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.github.luben/zstd-jni/1.5.7-4" -type f -name 'zstd-jni-1.5.7-4-darwin_aarch64.jar' -print -quit)
          test -n "$ffmpeg_jar"
          test -n "$zstd_jar"
          mountpoint=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mountpoint" -quiet || true
            rm -rf "$mountpoint"
          }
          trap cleanup EXIT
          # Answer only the test mount's embedded installer agreement prompt. The app's
          # mandatory first-launch acceptance remains unset and is tested separately.
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" <<< 'Y'
          app=$(find "$mountpoint" -maxdepth 2 -type d -name 'Indagium.app' -print -quit)
          test -n "$app"
          app_version=$(sed -n 's/^app.version=//p' gradle.properties)
          python3 scripts/prepare_media_sources.py --app-version "$app_version" --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --license-kind eula --platform macos-arm64 --package-root "$app" --ffmpeg-jar "$ffmpeg_jar" --zstd-jar "$zstd_jar"

      # jpackage doesn't emit StartupWMClass in the .desktop file it generates (no Gradle DSL
      # hook for it either), so docks/taskbars can't match the running window (WM_CLASS set to
      # "Indagium" via sun.java.command in Main.kt) back to this launcher entry — falls back to
      # a generic icon and the raw class name. Patch it in post-build since the .deb is just an
      # archive. The .desktop file ships at opt/<packageName>/lib/, not usr/share/applications —
      # postinst runs `xdg-desktop-menu install` on it at install time to put it there.
      #
      # Also defensively ensure postinst rebuilds the desktop/MIME cache after that install: the
      # fileAssociation() entries in build.gradle.kts land as MimeType= in the generated .desktop
      # file, but file managers resolve "Open With" candidates from the cached
      # /usr/share/applications/mimeinfo.cache, which is only rebuilt by update-desktop-database.
      # xdg-desktop-menu install may already trigger this internally on most distros, but jpackage
      # gives no guarantee of it (same class of gap as StartupWMClass above), so append an
      # idempotent call as a safety net rather than relying on unverified distro behavior.
      #
      # Three further defects in the same generated artifacts, per the Desktop Entry Spec
      # (https://specifications.freedesktop.org/desktop-entry/latest/exec-variables.html): an
      # entry that declares MimeType must carry a field code in Exec or it can never receive a
      # file at all — jpackage emits Exec with none, so "Open With Indagium" silently no-ops.
      # Append %F (not %f: Main.kt/AppState.openPaths takes a List<File>, and the single-instance
      # handoff wants to forward every path from one launch in one shot). Second, jpackage repeats
      # MimeType=text/plain once per fileAssociation() call — dedupe preserving first-seen order.
      # Third, replace the generated MimeInfo XML (duplicate text/plain blocks, each overriding
      # the system's own <comment>) with the hand-authored packaging/linux/indagium-mimeinfo.xml,
      # which only declares globs for extensions the system doesn't already type.
      - name: Add StartupWMClass and desktop-database refresh to Linux .desktop/postinst
        if: matrix.linux && matrix.include_deb
        run: |
          set -euo pipefail
          deb=$(find build/compose/binaries/main/deb -name '*.deb')
          workdir=$(mktemp -d)
          dpkg-deb -R "$deb" "$workdir"
          desktop_file=$(find "$workdir/opt" -maxdepth 3 -type f -name '*.desktop')
          if ! grep -q '^StartupWMClass=' "$desktop_file"; then
            echo "StartupWMClass=Indagium" >> "$desktop_file"
          fi
          postinst="$workdir/DEBIAN/postinst"
          if [ -f "$postinst" ] && ! grep -q 'update-desktop-database' "$postinst"; then
            echo 'update-desktop-database -q /usr/share/applications 2>/dev/null || true' >> "$postinst"
          fi
          if ! grep -q '^Exec=.* %F$' "$desktop_file"; then
            sed -i 's|^\(Exec=.*\)$|\1 %F|' "$desktop_file"
          fi
          mime_line=$(grep '^MimeType=' "$desktop_file" || true)
          if [ -n "$mime_line" ]; then
            deduped=$(echo "${mime_line#MimeType=}" | tr ';' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ';')
            sed -i "s|^MimeType=.*|MimeType=${deduped}|" "$desktop_file"
          fi
          # jpackage renders Categories= from menuGroup with no trailing separator, but the spec
          # types it as a list, and desktop-file-validate rejects a list key without one — that
          # would fail the gate below on an otherwise correct entry.
          if grep -q '^Categories=[^;]*$' "$desktop_file"; then
            sed -i 's|^\(Categories=.*\)$|\1;|' "$desktop_file"
          fi
          mimeinfo_file=$(find "$workdir/opt" -name '*-MimeInfo.xml')
          if [ -n "$mimeinfo_file" ]; then
            cp packaging/linux/indagium-mimeinfo.xml "$mimeinfo_file"
          fi
          dpkg-deb -b "$workdir" "$deb"
          rm -rf "$workdir"

      # desktop-file-validate is exactly the tool that flags "declares MimeType but Exec takes no
      # arguments" — this gate would have caught the original %F-less Exec regressing silently.
      - name: Validate generated .desktop entry
        if: matrix.linux && matrix.include_deb
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          deb=$(find build/compose/binaries/main/deb -name '*.deb')
          workdir=$(mktemp -d)
          dpkg-deb -R "$deb" "$workdir"
          desktop_file=$(find "$workdir/opt" -maxdepth 3 -type f -name '*.desktop')
          desktop-file-validate "$desktop_file"
          grep -q '^Exec=.* %F$' "$desktop_file"
          bash scripts/validate-native-mirror-package.sh "$workdir" native/linux/libindagium_mirror.so
          app_version=$(sed -n 's/^app.version=//p' gradle.properties)
          python3 scripts/prepare_media_sources.py --app-version "$app_version" --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --license-kind eula --platform '${{ matrix.media_platform }}' --package-root "$workdir"
          rm -rf "$workdir"

      # Verify every Linux artifact has the architecture suffix required by its packaging format
      # and that each portable package carries usable desktop/MIME metadata.  AppImage extraction
      # is deliberately done without FUSE, matching the environment used by its packaging task.
      - name: Validate and smoke-test Linux portable distributions
        if: matrix.linux
        run: |
          set -euo pipefail
          appimage=$(find build/compose/binaries/main/appimage -maxdepth 1 -type f -name "*-${{ matrix.portable_arch }}.AppImage" -print -quit)
          flatpak_bundle=$(find build/compose/binaries/main/flatpak -maxdepth 1 -type f -name "*-${{ matrix.portable_arch }}.flatpak" -print -quit)
          test -n "$appimage"
          test -n "$flatpak_bundle"
          # The extractor runs from its own temporary directory, so keep the AppImage path valid
          # after that directory change instead of relying on the checkout working directory.
          appimage=$(realpath "$appimage")
          test "$(find build/compose/binaries/main/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')" = 1
          test "$(find build/compose/binaries/main/flatpak -maxdepth 1 -type f -name '*.flatpak' | wc -l | tr -d ' ')" = 1

          if [ '${{ matrix.include_deb }}' = 'true' ]; then
            deb=$(find build/compose/binaries/main/deb -maxdepth 1 -type f -name "*_${{ matrix.deb_arch }}.deb" -print -quit)
            test -n "$deb"
            test "$(find build/compose/binaries/main/deb -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = 1
          fi

          appimage_workdir=$(mktemp -d)
          (
            cd "$appimage_workdir"
            chmod +x "$appimage"
            "$appimage" --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            desktop_file=$(find squashfs-root -type f -name '*.desktop' -print -quit)
            mimeinfo_file=squashfs-root/usr/share/mime/packages/com.indagium.Indagium-mimeinfo.xml
            test -n "$desktop_file"
            test -f "$mimeinfo_file"
            desktop-file-validate "$desktop_file"
            grep -q '^MimeType=.*text/plain' "$desktop_file"
            grep -q '^MimeType=.*text/x-log' "$desktop_file"
            xmllint --noout "$mimeinfo_file"
            bash "$GITHUB_WORKSPACE/scripts/validate-native-mirror-package.sh" squashfs-root native/linux/libindagium_mirror.so
            app_version=$(sed -n 's/^app.version=//p' "$GITHUB_WORKSPACE/gradle.properties")
            python3 "$GITHUB_WORKSPACE/scripts/prepare_media_sources.py" --app-version "$app_version" --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --license-kind eula --platform '${{ matrix.media_platform }}' --package-root squashfs-root
          )
          rm -rf "$appimage_workdir"

          flatpak install --user -y --bundle "$flatpak_bundle"
          flatpak info --user com.indagium.Indagium
          flatpak info --user --show-metadata com.indagium.Indagium | grep -q '^name=com.indagium.Indagium$'
          flatpak info --user --show-permissions com.indagium.Indagium | grep -q 'home'
          flatpak info --user --show-permissions com.indagium.Indagium | grep -q 'network'
          # Word-anchored: the permissions line is `;`-delimited, and a bare `grep x11` would also
          # match `fallback-x11` (substring), silently passing even if the manifest regressed to
          # the Wayland-with-X11-fallback socket that leaves Wayland-session users headless (see
          # packaging/linux/com.indagium.Indagium.yml). Assert plain x11 is present and
          # fallback-x11 is gone.
          flatpak info --user --show-permissions com.indagium.Indagium | grep -qE '(^|[;=])x11(;|$)'
          ! flatpak info --user --show-permissions com.indagium.Indagium | grep -q 'fallback-x11'
          deployment_dir=$(flatpak info --user --show-location com.indagium.Indagium)
          bash scripts/validate-native-mirror-package.sh "$deployment_dir/files" native/linux/libindagium_mirror.so
          app_version=$(sed -n 's/^app.version=//p' gradle.properties)
          python3 scripts/prepare_media_sources.py --app-version "$app_version" --ffmpeg-version 8.0.1-1.5.13 --javacv-version 1.5.13 --javacpp-version 1.5.13 --zstd-jni-version 1.5.7-4 --validate-package --license-kind eula --platform '${{ matrix.media_platform }}' --package-root "$deployment_dir/files"
          bash scripts/validate-flatpak-install.sh
          flatpak uninstall --user -y com.indagium.Indagium

      - name: Verify compatible LGPL replacements in a copied image
        run: |
          image=build/compose/binaries/main/app/Indagium
          if [[ "$RUNNER_OS" == macOS ]]; then image="$image.app"; fi
          python scripts/verify_lgpl_replacement.py --image "$image" --jdk-home "$JAVA_HOME"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_path }}
            build/Indagium-*-sources.tar.gz*
            build/legal-release/
            build/reports/licenses/*.json
          # Default retention is 90 days; these only need to survive long enough for the release
          # job below to download and republish them as GitHub Release assets (minutes, not
          # months) — the prior default was the other half of what exhausted the account's 500MB
          # Actions storage quota, alongside the per-tag Gradle caches fixed above.
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Only the package/source artifacts (named Indagium-*, see the build matrix and verify job)
      # and the dependency report — never "everything in the run". A run can also hold failure-only test-report
      # artifacts (desktop-test-report, video-duration-test-report-*), and after "Re-run failed
      # jobs" those from the failed attempt are still there: v1.8.9's release downloaded one and
      # tried to attach ~540 report files, hit GitHub's secondary rate limit and left a broken draft.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Indagium-*
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dependency-report
          path: artifacts/dependency-report

      # `body` is prepended to what generate_release_notes produces, so the download guidance sits
      # above the auto-generated commit list rather than replacing it. There are now three Linux
      # formats for each of two architectures, so call out both the package type and the arch
      # suffix rather than expecting people to infer compatibility from the filenames. The in-app
      # updater selects the matching release asset for .deb/AppImage launches; Flatpak updates are
      # intentionally delegated to Flatpak itself.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Refuse historical release changes and validate complete assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/prepare_release_assets.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --check-existing
          python3 scripts/prepare_release_assets.py --tag "$RELEASE_TAG" --artifacts artifacts --output release-assets

      - name: Create GitHub Release
        id: draft_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # Package types only, as a second guard on top of the download filter above.
          files: release-assets/*
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Which file do I need?

            | Your system | Download |
            |---|---|
            | Linux — Intel/AMD 64-bit | `.deb` `indagium_*_amd64.deb` · AppImage `Indagium-*-x86_64.AppImage` · Flatpak `Indagium-*-x86_64.flatpak` |
            | Linux — ARM 64-bit | `.deb` `indagium_*_arm64.deb` · AppImage `Indagium-*-aarch64.AppImage` · Flatpak `Indagium-*-aarch64.flatpak` |
            | Windows | `Indagium-*.msi` |
            | macOS — Apple Silicon | `Indagium-*.dmg` |

            Official binaries in this release use the Indagium EULA (attached as `EULA.md`);
            public source remains under PolyForm. Free functionality is available for commercial
            and non-commercial use; paid premium functionality is optional. Third-party licences
            remain separate. Source downloads do not require EULA acceptance or payment.
            The matching source assets are on [this version's release page](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}),
            and exact acquisition links are included in the installed `legal/source-acquisition.json`.

            The `Indagium-*-application-sources.tar.gz` archive contains matching Java-library and
            complete JVM source/build materials. The `Indagium-*-media-sources.tar.gz` archive contains pinned media-library sources,
            build inputs, licence texts, a SHA-256 file, and a manifest. It supports inspection and
            rebuilding; it is not a bit-for-bit reproducibility claim or patent clearance.

            Install a Linux `.deb` with `sudo dpkg -i <file>`, make an AppImage executable with
            `chmod +x <file>`, or use `flatpak install --user <file>` for a Flatpak bundle. The
            macOS build is unsigned, so Gatekeeper warns on first launch — see the README's
            Installation section for the workaround.

      - name: Verify uploaded assets and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          python3 scripts/prepare_release_assets.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --output release-assets
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
