name: Ad-hoc Linux arm64 build

# One-off, manually-triggered build of a Linux arm64 .deb, isolated from build.yml's release
# matrix (which has no arm64 entry). Dispatch this against whatever ref/tag you want packaged —
# GitHub Actions always runs the workflow file as committed on that ref.
on:
  workflow_dispatch:

jobs:
  package-arm64-deb:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Package distribution
        run: ./gradlew packageDeb

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openLog-linux-arm64-adhoc
          path: build/compose/binaries/main/deb
          retention-days: 7
